name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: '1.12.6.1673'
          clj-kondo: '2026.04.15'
          cljfmt: '0.16.4'
      - name: Check formatting
        run: cljfmt check src test dev test-build build.clj
      - name: Lint
        run: clj-kondo --lint src test dev test-build build.clj --fail-level warning

  test:
    name: Runtime tests (Clojure ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.11'
            command: clojure -M:test -m scry.cli
          - version: '1.12'
            command: clojure -M:test:clj-1.12 -m scry.cli
          - version: '1.13'
            command: clojure -M:test:clj-1.13 -m scry.cli
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: '1.12.6.1673'
      - name: Run runtime tests
        id: tests
        run: ${{ matrix.command }}
      - name: Upload test failures
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: scry-runtime-${{ matrix.version }}
          path: .scry-results/
          include-hidden-files: true
          if-no-files-found: warn

  build:
    name: Build verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: '1.12.6.1673'
      - name: Run build tests
        id: tests
        run: clojure -M:test:build-test -m scry.cli --dir test-build
      - name: Upload build test failures
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: scry-build
          path: .scry-results/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Build JAR
        run: clojure -T:build jar
