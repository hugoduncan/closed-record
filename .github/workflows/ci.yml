name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Development quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: '1.12.6.1673'
          bb: '1.13.225'
          clj-kondo: '2026.04.15'
          cljfmt: '0.16.4'
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Install pre-commit 4.6.0
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pre-commit"
          "$RUNNER_TEMP/pre-commit/bin/python" -m pip install pre-commit==4.6.0
          "$RUNNER_TEMP/pre-commit/bin/pre-commit" --version
          echo "$RUNNER_TEMP/pre-commit/bin" >> "$GITHUB_PATH"
      - name: Install Vale 3.17.1
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/vale"
          mkdir -p "$install_dir"
          cd "$install_dir"
          archive=vale_3.17.1_Linux_64-bit.tar.gz
          base=https://github.com/errata-ai/vale/releases/download/v3.17.1
          curl --fail --location --show-error --silent "$base/$archive" -o "$archive"
          echo "db947f89f2292e6a0381a61de155f6a5f5cb4cb460ca178ea412ef605559cefd  $archive" | sha256sum --check
          tar -xzf "$archive"
          ./vale --version
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Check formatting
        run: bb clj-fmt:check
      - name: Lint
        run: bb clj-kondo:lint
      - name: Check prose
        run: bb vale
      - name: Check API freshness
        run: bb api-docs --check
      - name: Run tooling tests
        id: tests
        env:
          JAVA_TOOL_OPTIONS: -Xmx768m
        run: clojure -Srepro -M:quickdoc:tooling-test -m scry.cli --dir test-tooling
      - name: Upload tooling test failures
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: scry-tooling
          path: .scry-results/
          include-hidden-files: true
          if-no-files-found: warn

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: '1.13.225'
      - name: Install lychee 0.24.2
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/lychee"
          mkdir -p "$install_dir"
          cd "$install_dir"
          archive=lychee-x86_64-unknown-linux-gnu.tar.gz
          base=https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2
          curl --fail --location --show-error --silent "$base/$archive" -o "$archive"
          curl --fail --location --show-error --silent "$base/$archive.sha256" -o "$archive.sha256"
          sha256sum --check "$archive.sha256"
          tar -xzf "$archive" --strip-components=1
          ./lychee --version
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Test link-check contracts
        run: bb dev/link_check_test.clj
      - name: Check Markdown links
        run: bb lychee:check

  test:
    name: Runtime tests (Clojure ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.11'
            command: clojure -M:test -m scry.cli
          - version: '1.12'
            command: clojure -M:test:clj-1.12 -m scry.cli
          - version: '1.13'
            command: clojure -M:test:clj-1.13 -m scry.cli
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: '1.12.6.1673'
      - name: Run runtime tests
        id: tests
        run: ${{ matrix.command }}
      - name: Upload test failures
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: scry-runtime-${{ matrix.version }}
          path: .scry-results/
          include-hidden-files: true
          if-no-files-found: warn

  build:
    name: Build verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: '1.12.6.1673'
      - name: Run build tests
        id: tests
        run: clojure -M:test:build-test -m scry.cli --dir test-build
      - name: Upload build test failures
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: scry-build
          path: .scry-results/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Build JAR
        run: clojure -T:build jar

  release:
    name: Release tooling verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: '1.12.6.1673'
      - name: Run release tests
        id: tests
        run: clojure -M:test:release:release-test -m scry.cli --dir test-release
      - name: Upload release test failures
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: scry-release
          path: .scry-results/
          include-hidden-files: true
          if-no-files-found: warn
