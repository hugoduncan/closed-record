StylesPath = styles
MinAlertLevel = suggestion
Packages = https://github.com/vale-cli/proselint/releases/download/v0.1.0/proselint.zip
Vocab = ClosedRecord

[*.md]
BasedOnStyles = Vale, proselint
# Lambda instructions are not prose. Markdown fenced code is excluded by Vale.
BlockIgnores = (?m)^λ[^\n]*
